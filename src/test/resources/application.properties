# Тесты идут на встроенной H2 в режиме PostgreSQL, чтобы не требовать запущенной СУБД
spring.datasource.url=jdbc:h2:mem:expenses;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# нужны бину ApplicationInfo
app.name=Data Analysis
app.version=0.0.1-SNAPSHOT
