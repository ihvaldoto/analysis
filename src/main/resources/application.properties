spring.application.name=data-analysis
app.name=Data Analysis
app.version=0.0.1-SNAPSHOT

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/data_analysis
spring.datasource.username=postgres
spring.datasource.password=admin
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=${app.name}
info.app.version=${app.version}

# Администратор, создаётся при старте, если его ещё нет. Смените пароль!
app.admin.login=admin
app.admin.password=admin
